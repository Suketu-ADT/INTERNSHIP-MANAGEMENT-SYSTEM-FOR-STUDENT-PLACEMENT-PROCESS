{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="empty-state"><i class="fa-solid fa-lock"></i>
  <h3 class="h3">Access Denied</h3>
  <p class="text-muted-sm">You don't have permission to view this page.</p>
  <a href="{{ url_for('auth.index') }}" class="btn btn-primary-c mt-2">Go Home</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="auth-wrap"><div class="empty-state"><i class="fa-solid fa-lock"></i>
  <h3 class="h3">Access Denied</h3>
  <a href="{{ url_for('auth.login') }}" class="btn btn-primary-c mt-2">Log In</a>
</div></div>
{% endblock %}
