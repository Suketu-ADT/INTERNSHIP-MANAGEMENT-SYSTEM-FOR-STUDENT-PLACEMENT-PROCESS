{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="empty-state"><i class="fa-solid fa-compass"></i>
  <h3 class="h3">Page Not Found</h3>
  <p class="text-muted-sm">The page you're looking for doesn't exist.</p>
  <a href="{{ url_for('auth.index') }}" class="btn btn-primary-c mt-2">Go Home</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="auth-wrap"><div class="empty-state"><i class="fa-solid fa-compass"></i>
  <h3 class="h3">Page Not Found</h3>
  <a href="{{ url_for('auth.login') }}" class="btn btn-primary-c mt-2">Log In</a>
</div></div>
{% endblock %}
