{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>
  <h3 class="h3">Something Went Wrong</h3>
  <p class="text-muted-sm">An unexpected error occurred. Please try again.</p>
  <a href="{{ url_for('auth.index') }}" class="btn btn-primary-c mt-2">Go Home</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="auth-wrap"><div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>
  <h3 class="h3">Something Went Wrong</h3>
  <a href="{{ url_for('auth.login') }}" class="btn btn-primary-c mt-2">Log In</a>
</div></div>
{% endblock %}
